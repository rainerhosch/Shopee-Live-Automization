<div class="field-row">
  <div class="field">
    <label>Admin Live / Operator</label>
    <input class="operator-input" placeholder="Nama Operator..." />
  </div>
</div>
<div class="field-row">
  <div class="field">
    <label>Koin untuk dibagikan</label>
    <input type="number" id="hujan-koin" value="255" />
  </div>
  <div class="field">
    <label>Interval (detik)</label>
    <input id="hujan-interval" type="number" value="600" min="10" />
  </div>
</div>
<div class="btn-row" style="margin-top:1rem">
  <button class="btn btn-primary btn-add-task-partial" data-task="hujan_bonus">Add Hujan Bonus Task</button>
  <button class="btn btn-run-once-partial" data-task="hujan_bonus">Run once now</button>
</div>
